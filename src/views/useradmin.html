<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administración de usuarios | Xwomen</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <style>
      .useradmin__list {
        display: block;
        width: 100%;
        height: calc(100vh - 260px);
        min-height: 400px;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div class="dashboard">
      <iframe
        class="dashboard__navbar"
        src="../componets/navbar.html"
        title="Barra de navegación"
        scrolling="no"
      ></iframe>

      <div class="dashboard__content">
        <iframe
          class="dashboard__sidebar"
          id="userAdminSidebar"
          src="../componets/sidebar.html"
          title="Menú principal"
        ></iframe>
        <main class="dashboard__main" aria-label="Administración de usuarios">
          <div class="container-fluid p-3 p-lg-4">
            <header class="d-flex flex-wrap align-items-center gap-3 mb-3">
              <button
                class="btn btn-outline-secondary btn-sm"
                id="sidebarToggle"
                type="button"
                aria-controls="userAdminSidebar"
                aria-expanded="true"
                aria-label="Ocultar menú"
                title="Ocultar menú"
              >
                <svg aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                  <path d="M3 4.5h12M3 9h12M3 13.5h12"></path>
                </svg>
              </button>
              <h1 class="h4 mb-0">Administrar usuario</h1>
            </header>
            <section class="accordion mb-3" id="newUserAccordion" aria-label="Crear usuario">
              <div class="accordion-item">
                <h2 class="accordion-header" id="newUserHeading">
                  <button
                    class="accordion-button collapsed"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#newUserPanel"
                    aria-expanded="false"
                    aria-controls="newUserPanel"
                  >
                    Nuevo usuario
                  </button>
                </h2>
                <div
                  id="newUserPanel"
                  class="accordion-collapse collapse"
                  aria-labelledby="newUserHeading"
                  data-bs-parent="#newUserAccordion"
                >
                  <div class="accordion-body">
                    <form>
                      <div class="row g-3">
                        <div class="col-12 col-md-6">
                          <label class="form-label" for="newUserName">Nombre</label>
                          <input class="form-control" id="newUserName" name="nombre" type="text" required>
                        </div>
                        <div class="col-12 col-md-6">
                          <label class="form-label" for="newUserLastName">Apellido</label>
                          <input class="form-control" id="newUserLastName" name="apellido" type="text" required>
                        </div>
                        <div class="col-12 col-md-6">
                          <label class="form-label" for="newUserEmail">Email</label>
                          <input class="form-control" id="newUserEmail" name="email" type="email" required>
                        </div>
                        <div class="col-12 col-md-6">
                          <label class="form-label" for="newUserRole">Role</label>
                          <select class="form-select" id="newUserRole" name="role" required>
                            <option value="" selected disabled>Selecciona un rol</option>
                            <option value="admin">Admin</option>
                            <option value="editor">Editor</option>
                            <option value="usuario">Usuario</option>
                          </select>
                        </div>
                      </div>
                      <div class="d-flex justify-content-end gap-2 mt-3">
                        <button class="btn btn-outline-secondary" type="reset">Limpiar</button>
                        <button class="btn btn-primary" type="button">Guardar usuario</button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </section>

            <iframe
              class="useradmin__list"
              src="../componets/userlist.html"
              title="Lista de usuarios"
            ></iframe>
          </div>
        </main>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
    <script>
      const sidebarToggle = document.getElementById('sidebarToggle');
      const sidebar = document.getElementById('userAdminSidebar');

      sidebarToggle.addEventListener('click', () => {
        const isExpanded = sidebarToggle.getAttribute('aria-expanded') === 'true';
        sidebarToggle.setAttribute('aria-expanded', String(!isExpanded));
        sidebar.classList.toggle('is-collapsed', isExpanded);
        const action = isExpanded ? 'Mostrar menú' : 'Ocultar menú';
        sidebarToggle.setAttribute('aria-label', action);
        sidebarToggle.title = action;
      });
    </script>
  </body>
</html>
