<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
  crossorigin="anonymous"
>

<style>
  .xwomen-sidebar {
    width: 100%;
    max-width: 280px;
    min-height: 100vh;
    color: #344054;
    background-color: #fff;
    border-right: 1px solid #eaecf0;
  }

  .xwomen-sidebar__heading {
    margin: 0 0 0.6rem;
    padding: 0 0.75rem;
    color: #98a2b3;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .xwomen-sidebar__section {
    display: flex;
    width: 100%;
    align-items: center;
    justify-content: space-between;
    margin: 1.25rem 0 0.4rem;
    padding: 0 0.75rem;
    border: 0;
    color: #98a2b3;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-align: left;
    text-transform: uppercase;
    background: transparent;
    cursor: pointer;
  }

  .xwomen-sidebar__chevron {
    flex: 0 0 auto;
    transition: transform 150ms ease;
  }

  .xwomen-sidebar__section[aria-expanded="false"] .xwomen-sidebar__chevron {
    transform: rotate(-90deg);
  }

  .xwomen-sidebar__submenu[hidden] {
    display: none !important;
  }

  .xwomen-sidebar .nav-link {
    min-height: 40px;
    padding: 0.55rem 0.75rem;
    border-radius: 0.6rem;
    color: #475467;
    font-size: 0.9rem;
    font-weight: 500;
    transition: color 150ms ease, background-color 150ms ease;
  }

  .xwomen-sidebar .nav-link:hover,
  .xwomen-sidebar .nav-link:focus {
    color: #1d2939;
    background-color: #f2f4f7;
  }

  .xwomen-sidebar .nav-pills .nav-link.active {
    padding-left: calc(0.75rem - 3px);
    border-left: 3px solid #4f46e5;
    color: #3730a3;
    background-color: #eef2ff;
    font-weight: 600;
  }

  @media (prefers-reduced-motion: reduce) {
    .xwomen-sidebar .nav-link {
      transition: none;
    }
  }
</style>

<aside class="xwomen-sidebar flex-shrink-0 p-3" aria-label="Barra lateral">
  <nav aria-label="Menú principal">
    <p class="xwomen-sidebar__heading">Menú principal</p>
    <ul class="nav nav-pills flex-column gap-1">
      <li class="nav-item">
        <a class="nav-link active" href="#" aria-current="page">Dashboard</a>
      </li>

      <li>
        <button class="xwomen-sidebar__section" type="button" aria-expanded="true" aria-controls="sidebar-settings">
          <span>Configuración</span>
          <svg class="xwomen-sidebar__chevron" aria-hidden="true" focusable="false" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="m2 4.5 4 4 4-4"></path>
          </svg>
        </button>
        <ul class="xwomen-sidebar__submenu nav flex-column gap-1 ms-2" id="sidebar-settings">
          <li class="nav-item"><a class="nav-link" href="#">Password</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Email</a></li>
        </ul>
      </li>

      <li>
        <button class="xwomen-sidebar__section" type="button" aria-expanded="true" aria-controls="sidebar-users">
          <span>Usuarios</span>
          <svg class="xwomen-sidebar__chevron" aria-hidden="true" focusable="false" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="m2 4.5 4 4 4-4"></path>
          </svg>
        </button>
        <ul class="xwomen-sidebar__submenu nav flex-column gap-1 ms-2" id="sidebar-users">
          <li class="nav-item"><a class="nav-link" href="../views/useradmin.html" target="_top">Admin</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Restor</a></li>
        </ul>
      </li>

      <li>
        <button class="xwomen-sidebar__section" type="button" aria-expanded="true" aria-controls="sidebar-inventory">
          <span>Inventario</span>
          <svg class="xwomen-sidebar__chevron" aria-hidden="true" focusable="false" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="m2 4.5 4 4 4-4"></path>
          </svg>
        </button>
        <ul class="xwomen-sidebar__submenu nav flex-column gap-1 ms-2" id="sidebar-inventory">
          <li class="nav-item"><a class="nav-link" href="#">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Entrada</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Salida</a></li>
        </ul>
      </li>
    </ul>
  </nav>
</aside>

<script>
  document.querySelectorAll('.xwomen-sidebar__section').forEach((button) => {
    button.addEventListener('click', () => {
      const submenu = document.getElementById(button.getAttribute('aria-controls'));
      const isExpanded = button.getAttribute('aria-expanded') === 'true';
      button.setAttribute('aria-expanded', String(!isExpanded));
      submenu.hidden = isExpanded;
    });
  });
</script>
